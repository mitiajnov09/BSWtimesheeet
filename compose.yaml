services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      APP_DB: /app/data/rotations.sqlite3
      APP_ORIGIN: https://${APP_DOMAIN:?Set APP_DOMAIN in .env}
      APP_SECURE_COOKIE: "1"
    volumes:
      - rotations_data:/app/data
      - ./backups:/backups
    expose:
      - "8080"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  rotations_data:
  caddy_data:
  caddy_config:
